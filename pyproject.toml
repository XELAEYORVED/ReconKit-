[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reconkit"
version = "0.1.0"
description = "ReconKit — Passive OSINT reconnaissance toolkit (CLI + web dashboard)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ReconKit" }]
keywords = ["osint", "recon", "passive", "security", "threat-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]

dependencies = [
    # CLI + output
    "click>=8.1",
    "rich>=13.7",
    # Config
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # Async HTTP + DNS
    "httpx>=0.27",
    "dnspython>=2.6",
    "python-whois>=0.9.4",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "greenlet>=3.0",
    "aiosqlite>=0.20",
    # Web server
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    # Reporting
    "jinja2>=3.1",
    "markdown>=3.6",
    # Crypto for API key storage
    "cryptography>=42.0",
]

[project.optional-dependencies]
metadata = ["pypdf>=4.2", "pillow>=10.3", "python-docx>=1.1"]
redis = ["redis>=5.0"]
pdf = ["weasyprint>=61.0"]
postgres = ["asyncpg>=0.29", "psycopg2-binary>=2.9"]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "mypy>=1.9",
    "ruff>=0.3",
    "types-PyYAML",
]

[project.scripts]
reconkit = "reconkit.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["reconkit", "server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
