services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      RECONKIT_DATABASE_URL: sqlite+aiosqlite:///./data/reconkit.db
      RECONKIT_CACHE_BACKEND: redis
      RECONKIT_REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  # Optional standalone frontend (the backend already serves the built UI at :8000).
  frontend:
    build: ./web
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
